# Render Blueprint: one web service hosts the API, Socket.io and the built React app.
services:
  - type: web
    name: maykraft-studios
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: VITE_SHOW_DEMO
        value: "true"
